name: payment-reconciler

# ---------------------------------------------------------------------------
# 6-hour background payment monitoring — safety-net reconciler.
#
# Vercel's Hobby plan rejects sub-daily cron jobs at DEPLOY time, so the
# every-minute reconciler that used to live in vercel.json ("* * * * *" on
# /api/payment/cron/scan) cannot be a Vercel Cron. This scheduled workflow
# replaces it: it periodically calls the EXISTING protected endpoint
#   POST /api/payment/cron/scan
# which retires 6h-abandoned windows (store.expireOverduePayments) and runs one
# coalesced mailbox scan (verifier.triggerMailboxScan). That keeps the
# up-to-6-hour monitoring alive independently of the browser, on the free plan,
# without upgrading to Vercel Pro.
#
# Instant detection still happens via the Gmail push webhook (/gmail-push);
# this workflow is only the fallback sweep for a missed/late push. The endpoint
# is idempotent (settle-requires-PENDING + notification fingerprints + atomic
# coupon unlock), so repeated or overlapping calls cannot double-process.
#
# Auth: the endpoint accepts `x-cron-key: <CRON_SECRET>` (or
# `Authorization: Bearer <CRON_SECRET>`). The value is read from the
# CRON_SECRET repository secret and is NEVER written into this file or logs.
#
# ── ONE-TIME SETUP (repo → Settings → Secrets and variables → Actions) ──
#   Secret    CRON_SECRET          = the SAME value as the CRON_SECRET env var
#                                     already set in the Vercel project
#   Variable  PRODUCTION_BASE_URL  = https://savehatke.vercel.app   (optional;
#                                     this URL is used when the variable is unset)
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '*/5 * * * *'      # every 5 minutes — GitHub Actions' minimum cadence
  workflow_dispatch: {}         # manual "Run workflow" button in the Actions tab

# Never let two sweeps overlap; a new scheduled run waits for the current one.
concurrency:
  group: payment-reconciler
  cancel-in-progress: false

# This job only makes one outbound HTTPS call — it needs no repo token scopes.
permissions: {}

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Sweep + scan pending payments
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -uo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Repository secret CRON_SECRET is not set. Add it under Settings -> Secrets and variables -> Actions, using the SAME value as the CRON_SECRET env var in Vercel."
            exit 1
          fi
          BASE_URL="${PRODUCTION_BASE_URL:-https://savehatke.vercel.app}"
          ENDPOINT="${BASE_URL%/}/api/payment/cron/scan"
          echo "Reconciler endpoint: ${ENDPOINT}"
          fail=0
          # GitHub's minimum schedule is 5 min; ping ~once a minute within the run
          # so the effective sweep cadence stays close to the original every-minute
          # reconciler. The endpoint is idempotent, so this is safe.
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/scan.json -w '%{http_code}' \
              -X POST "${ENDPOINT}" \
              -H "x-cron-key: ${CRON_SECRET}" \
              --max-time 60) || code="000"
            body=$(head -c 300 /tmp/scan.json 2>/dev/null || true)
            echo "attempt ${i} -> HTTP ${code} ${body}"
            if [ "${code}" != "200" ]; then
              fail=$((fail+1))
              echo "::warning::reconciler attempt ${i} returned HTTP ${code}"
            fi
            if [ "${i}" -lt 5 ]; then sleep 50; fi
          done
          if [ "${fail}" -ge 5 ]; then
            echo "::error::all reconciler attempts failed this run"
            exit 1
          fi
