name: Admin biometric auth checks

on:
  pull_request:
    branches: [main]
    paths:
      - "server/routes/adminBiometric.js"
      - "server/routes/auth.js"
      - "server/services/supabase.js"
      - "server/server.js"
      - "public/admin-biometric-login.html"
      - "public/js/admin-passkey-login.js"
      - "public/js/admin-passkeys.js"
      - "supabase/migrations/20261105_admin_biometric_auth.sql"
      - "package.json"
      - "vercel.json"
  push:
    branches: [feature/admin-biometric-auth]

permissions:
  contents: read

jobs:
  passkey-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (refreshes lock resolution in the runner)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check server/routes/adminBiometric.js
          node --check server/services/adminFaceLiveness.js
          node --check public/js/admin-face-liveness.mjs
          node --check server/routes/auth.js
          node --check server/services/supabase.js
          node --check server/server.js
          node --check public/js/admin-passkey-login.js
          node --check public/js/admin-passkeys.js
      - name: Run existing security regression checks
        env:
          JWT_SECRET: ci-only-never-use-in-production-9876543210
          NODE_ENV: test
          GOOGLE_CLIENT_ID: ci-test.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-only-not-a-real-oauth-secret
          GOOGLE_REDIRECT_URI: http://localhost:3199/api/auth/google-redirect
          PAYMENT_WEBHOOK_SECRET: ci-only-not-a-real-webhook-secret
          TURNSTILE_SITE_KEY: ci-test-public-site-key
        run: |
          npm run verify:security
          npm run verify:fail-closed
      - name: Upload refreshed npm lockfile
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: admin-biometric-npm-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
