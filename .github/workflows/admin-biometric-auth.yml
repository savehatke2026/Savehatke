name: Admin biometric auth checks

on:
  pull_request:
    branches: [main]
    paths:
      - "server/routes/adminBiometric.js"
      - "server/routes/auth.js"
      - "server/services/supabase.js"
      - "server/services/adminFaceLiveness.js"
      - "verify-admin-biometric-config.cjs"
      - "server/server.js"
      - "public/admin-biometric-login.html"
      - "public/js/admin-passkey-login.js"
      - "public/js/admin-passkeys.js"
      - "public/js/admin-face-liveness.mjs"
      - "public/js/admin-face-liveness.css"
      - "scripts/admin-face-liveness-entry.jsx"
      - "scripts/build-admin-face-liveness.cjs"
      - "supabase/migrations/20261105_admin_biometric_auth.sql"
      - "package.json"
      - "vercel.json"
  push:
    branches: [feature/admin-biometric-auth]

permissions:
  contents: write

jobs:
  passkey-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (refreshes lock resolution in the runner)
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build self-hosted face liveness UI
        run: npm run build:admin-face-liveness
      - name: Check JavaScript syntax
        run: |
          node --check verify-admin-biometric-config.cjs
          node --check server/routes/adminBiometric.js
          node --check public/js/admin-face-liveness.mjs
          node --check server/services/adminFaceLiveness.js
          node --check server/routes/auth.js
          node --check server/services/supabase.js
          node --check server/server.js
          node --check public/js/admin-passkey-login.js
          node --check public/js/admin-passkeys.js
      - name: Run existing security regression checks
        env:
          JWT_SECRET: ci-only-never-use-in-production-9876543210
          NODE_ENV: test
          GOOGLE_CLIENT_ID: ci-test.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: ci-only-not-a-real-oauth-secret
          GOOGLE_REDIRECT_URI: http://localhost:3199/api/auth/google-redirect
          PAYMENT_WEBHOOK_SECRET: ci-only-not-a-real-webhook-secret
          TURNSTILE_SITE_KEY: ci-test-public-site-key
        run: |
          npm run verify:security
          npm run verify:fail-closed
      - name: Verify face-recognition configuration fails closed
        run: npm run verify:biometric
      - name: Upload refreshed npm lockfile
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: admin-biometric-npm-lockfile
          path: |
            package-lock.json
            public/js/admin-face-liveness.mjs
            public/js/admin-face-liveness.css
          if-no-files-found: error
          retention-days: 1
      - name: Sync refreshed lockfile to the feature branch
        if: success() && ((github.event_name == 'push' && github.ref == 'refs/heads/feature/admin-biometric-auth') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          cp package-lock.json /tmp/admin-biometric-package-lock.json
          cp public/js/admin-face-liveness.mjs /tmp/admin-face-liveness.mjs
          cp public/js/admin-face-liveness.css /tmp/admin-face-liveness.css
          git fetch origin "$SOURCE_BRANCH"
          git checkout -B "$SOURCE_BRANCH" FETCH_HEAD
          cp /tmp/admin-biometric-package-lock.json package-lock.json
          cp /tmp/admin-face-liveness.mjs public/js/admin-face-liveness.mjs
          cp /tmp/admin-face-liveness.css public/js/admin-face-liveness.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json public/js/admin-face-liveness.mjs public/js/admin-face-liveness.css
          if git diff --cached --quiet; then
            echo "package-lock.json and the generated face bundle are already synchronized"
            exit 0
          fi
          git commit -m "build: sync npm lockfile for admin biometric dependencies"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$SOURCE_BRANCH"; then
              exit 0
            fi
            echo "Branch moved during generated-file sync; rebasing on latest remote head (attempt $attempt)."
            git fetch origin "$SOURCE_BRANCH"
            git rebase FETCH_HEAD
          done
          echo "Could not sync generated files after three safe push attempts."
          exit 1
