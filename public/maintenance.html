<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SaveHatke is temporarily under maintenance. Please check back shortly.">
  <title>Under Maintenance — SaveHatke</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #060d1f;
      color: #e2ecff;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* ── Ambient background glow ── */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(0,230,118,.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(ellipse, rgba(79,195,247,.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Animations ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    /* ── Main container ── */
    .maintenance-container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 100%;
      padding: 32px 24px;
      text-align: center;
      animation: fadeInUp .7s ease;
    }

    /* ── Heading ── */
    .maint-heading {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      line-height: 1.2;
      margin-bottom: 16px;
      color: #e2ecff;
    }
    .maint-heading .highlight {
      background: linear-gradient(90deg, #00e676 0%, #4fc3f7 35%, #00e676 70%, #4fc3f7 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3.5s linear infinite;
    }

    /* ── Message ── */
    .maint-message {
      font-size: 1rem;
      line-height: 1.7;
      color: #8ba2c4;
      max-width: 440px;
      margin: 0 auto 32px;
    }

    /* ── Footer ── */
    .maint-footer {
      margin-top: 48px;
      font-size: .78rem;
      color: #4a6080;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .maint-heading { font-size: 1.55rem; }
      .maint-message { font-size: .92rem; }
    }
  </style>
</head>
<body>

  <div class="maintenance-container">

    <!-- Heading -->
    <h1 class="maint-heading">
      🔧 We're <span class="highlight">Under Maintenance</span>
    </h1>

    <!-- Message (dynamic from server, or default) -->
    <p class="maint-message" id="maintMessage">
      SaveHatke is temporarily unavailable while we make some improvements.
      Please check back shortly. Thank you for your patience.
    </p>

    <!-- Footer -->
    <div class="maint-footer">
      &copy; SaveHatke · We'll be back soon
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;

    // Pull the caller's stored token (if any) so the status endpoint can
    // tell us whether THIS browser session is an admin. Admins are never
    // held on the maintenance page.
    function getCallerToken() {
      try {
        return (localStorage.getItem('sh_admin_token')
              || localStorage.getItem('sh_token')
              || '').trim();
      } catch (e) { return ''; }
    }

    // On load: fetch the latest maintenance message + caller access.
    // The server already 302s this page to /index when maintenance is OFF;
    // this check is a client-side fallback for a cached copy of the page.
    (async function loadMessage() {
      let data = null;
      try {
        const headers = { 'Accept': 'application/json' };
        const token = getCallerToken();
        if (token) headers['Authorization'] = 'Bearer ' + token;
        const res = await fetch(`${API_BASE}/api/maintenance/status`, { headers, cache: 'no-store' });
        data = await res.json();
      } catch (e) {
        // Keep default message and stay put — a network blip is not a
        // reason to dump a user into a redirect loop.
        return;
      }

      if (data.message) {
        document.getElementById('maintMessage').textContent = data.message;
      }

      // Redirect away from the maintenance page if either:
      //  - maintenance is OFF for everyone, OR
      //  - the caller is an admin
      // canAccess is computed server-side and is the single source of truth.
      if (data && data.canAccess) {
        const dest = data.isAdmin && adminLooksLoggedIn()
          ? '/dashboard.html'
          : '/index.html';
        window.location.replace(dest);
      }
    })();

    function adminLooksLoggedIn() {
      try {
        return !!localStorage.getItem('sh_admin_token');
      } catch (e) { return false; }
    }
  </script>
</body>
</html>
