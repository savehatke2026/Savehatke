<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SaveHatke is temporarily under maintenance. Please check back shortly.">
  <title>Under Maintenance — SaveHatke</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Outfit', sans-serif;
      background: #060d1f;
      color: #e2ecff;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }
    a { text-decoration: none; color: inherit; }

    .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; width: 100%; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #060d1f; }
    ::-webkit-scrollbar-thumb { background: #1a3055; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #00e676; }

    /* Buttons — js/app.js renders the nav Log In button into .nav-actions
       with these classes; without them it fell back to a bare browser
       button instead of the green pill shown on every page. */
    .btn { display:inline-flex; align-items:center; gap:8px; padding:0 28px; height:48px; border-radius:10px; font-family:'Outfit',sans-serif; font-size:.95rem; font-weight:700; border:none; cursor:pointer; white-space:nowrap; transition:all .22s; }
    .btn-sm { height:38px; padding:0 18px; font-size:.85rem; border-radius:8px; }
    .btn-primary { background:linear-gradient(135deg,#00e676,#00c853); color:#060d1f; }
    .btn-primary:hover { opacity:.88; transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,230,118,.38); }
    .btn-ghost { background:transparent; color:#8ba2c4; border:1px solid rgba(139,162,196,.35); }
    .btn-ghost:hover { color:#e2ecff; border-color:rgba(226,236,255,.6); transform:translateY(-2px); }

    /* ── Ambient background glow ── */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(0,230,118,.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 50%;
      height: 50%;
      background: radial-gradient(ellipse, rgba(79,195,247,.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── TOP BAR — brand on the left, the same .nav-actions slot as every
       other page on the right: js/app.js renders the Log In button (or the
       signed-in profile box) there, exactly like index.html. No navigation
       links — maintenance-nav-lock.js keeps the page's only actions
       (Log In / Log Out) from leaving maintenance. ── */
    .topbar { position:fixed; top:0; left:0; right:0; z-index:100; height:68px; background:rgba(6,13,31,.85); backdrop-filter:blur(20px); border-bottom:1px solid rgba(79,195,247,.1); }
    .topbar .container { height:100%; display:flex; align-items:center; }
    .brand { display:flex; align-items:center; gap:10px; font-size:1.25rem; font-weight:800; }
    .brand-icon { width:34px; height:34px; object-fit:contain; }
    .bhl { color:#00e676; }
    .nav-actions { margin-left:auto; display:flex; align-items:center; gap:10px; }

    /* ── Animations ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

    /* ── Middle section: the maintenance message. The login/logout action
       lives in the top bar, same position as every other page. ── */
    .maintenance-container {
      position: relative;
      z-index: 1;
      max-width: 560px;
      width: 100%;
      padding: 0 24px;
      margin: auto; /* centres between the fixed top bar and the bottom bar */
      text-align: center;
      animation: fadeInUp .7s ease;
    }

    .maint-gear {
      font-size: 2.6rem;
      display: inline-block;
      margin-bottom: 14px;
      animation: float 3.2s ease-in-out infinite;
    }

    /* ── Heading ── */
    .maint-heading {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      line-height: 1.2;
      margin-bottom: 16px;
      color: #e2ecff;
    }
    .maint-heading .highlight {
      background: linear-gradient(90deg, #00e676 0%, #4fc3f7 35%, #00e676 70%, #4fc3f7 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shimmer 3.5s linear infinite;
    }

    /* ── Message ── */
    .maint-message {
      font-size: 1rem;
      line-height: 1.7;
      color: #8ba2c4;
      max-width: 440px;
      margin: 0 auto;
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .maint-heading { font-size: 1.55rem; }
      .maint-message { font-size: .92rem; }
    }

    /* ── MOBILE TOUCH TARGETS ──
       Invisible absolutely-positioned ::after widens each control's
       tappable region to ~44px on phones, so the brand and the top-right
       Log In / Log Out button are as easy to hit here as on every page. */
    @media(max-width:768px),(max-height:500px) and (orientation:landscape){
      .brand{position:relative}
      .brand::after{content:'';position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
      .nav-actions .btn{position:relative}
      .nav-actions .btn::after{content:'';position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
    }
  </style>
</head>
<body>

<!-- TOP BAR — brand on the left, Log In / profile box on the right in the
     same .nav-actions position as index.html (rendered by js/app.js).
     No navigation links while maintenance is ON. -->
<header class="topbar" role="banner">
  <div class="container">
    <div class="brand" aria-label="SaveHatke">
      <img src="logo.png" alt="SaveHatke" class="brand-icon">
      <span>Save<span class="bhl">Hatke</span></span>
    </div>
    <!-- js/app.js renders the Log In button (or the signed-in profile box)
         here, exactly as it does in the index.html navbar. -->
    <div class="nav-actions" id="maintAction"></div>
  </div>
</header>

<!-- MIDDLE — the maintenance message. Whitelisted users who log in land on
     the normal site (the server recognises their session and never shows
     them this page again). -->
<main class="maintenance-container" style="padding-top:68px;">
  <span class="maint-gear" aria-hidden="true">🔧</span>
  <h1 class="maint-heading">
    We're <span class="highlight">Under Maintenance</span>
  </h1>
  <p class="maint-message" id="maintMessage">
    SaveHatke is temporarily unavailable while we make some improvements.
    Please check back shortly. Thank you for your patience.
  </p>
</main>

<script src="js/app.js"></script>
<!-- Safety net: intercepts the profile dropdown's Dashboard link in case
     app.js renders a signed-in dropdown, and keeps any other stray link on
     this page. Login and logout keep working. -->
<script src="js/maintenance-nav-lock.js"></script>
<script>
  // ── Maintenance page behaviour ─────────────────────────────────────────
  // The server 302s /maintenance → /index.html when maintenance is OFF, so
  // this script normally only runs while maintenance is genuinely ON. It
  // exists for the cached-copy case and to move users along the moment the
  // toggle flips:
  //   - maintenance turns OFF  → /index.html
  //   - caller is an admin     → the admin panel (admins bypass maintenance)
  //   - caller is whitelisted  → /index.html (they bypass maintenance, so a
  //     whitelisted login must open the normal site, never this page)

  // NOTE: js/app.js (loaded above) already declares a global `const API_BASE`
  // (='/api'). Re-declaring it here would throw a SyntaxError at script-compile
  // time and silently kill this whole block, so this page uses MAINT_API_BASE.
  const MAINT_API_BASE = window.location.origin;

  function getCallerToken() {
    try {
      return (localStorage.getItem('sh_admin_token')
            || localStorage.getItem('sh_token')
            || '').trim();
    } catch (e) { return ''; }
  }

  function adminLooksLoggedIn() {
    try {
      return !!localStorage.getItem('sh_admin_token');
    } catch (e) { return false; }
  }
  // ── The page's action ──────────────────────────────────────────────────
  // js/app.js renders the top-right .nav-actions slot on DOMContentLoaded,
  // exactly like on index.html: "Log In" → /login.html for anonymous visitors
  // (login keeps working during maintenance; whitelisted users who log in
  // are sent straight to the real site), and the signed-in profile box with
  // its Log Out item otherwise. maintenance-nav-lock.js keeps the dropdown's
  // Dashboard link from leaving maintenance while Log Out keeps working, so
  // this page needs no action-rendering code of its own.

  async function checkMaintenanceStatus() {
    let data = null;
    try {
      const headers = { 'Accept': 'application/json' };
      const token = getCallerToken();
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const res = await fetch(`${MAINT_API_BASE}/api/maintenance/status`, { headers, cache: 'no-store', credentials: 'include' });
      data = await res.json();
    } catch (e) {
      // A network blip is not a reason to dump the user into a redirect
      // loop — stay put and try again on the next poll.
      return;
    }

    if (data && data.message) {
      const el = document.getElementById('maintMessage');
      if (el) el.textContent = data.message;
    }

    // Leave the page only when the server says this caller is no longer
    // held: maintenance OFF for everyone, or the caller is an admin /
    // whitelisted user. canAccess is computed server-side from VERIFIED
    // credentials, so a whitelisted login lands on the normal site.
    if (data && data.canAccess) {
      const dest = (data.isAdmin && adminLooksLoggedIn())
        ? '/vault'
        : '/index.html';
      window.location.replace(dest);
    }
  }

  checkMaintenanceStatus();
  // Re-check periodically so a user parked here is sent on their way as
  // soon as maintenance is switched off or their email is whitelisted —
  // the navbar's Log In / Log Out (rendered by js/app.js) is the only
  // action they need in the meantime.
  setInterval(checkMaintenanceStatus, 30000);
</script>
</body>
</html>
