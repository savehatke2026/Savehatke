<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in or create an account on SaveHatke — India's smartest price tracker & coupon marketplace.">
  <title>Log In / Sign Up — SaveHatke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; height: 100%; }
    body { font-family: 'Outfit', sans-serif; background: #060d1f; color: #e2ecff; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #060d1f; }
    ::-webkit-scrollbar-thumb { background: #1a3055; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #00e676; }
    a { text-decoration: none; color: inherit; }

    @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

    .gtext { background: linear-gradient(135deg,#00e676,#4fc3f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .shimmer { background: linear-gradient(90deg,#00e676 0%,#4fc3f7 35%,#00e676 70%,#4fc3f7 100%); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:shimmer 3.5s linear infinite; }

    .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; width: 100%; }

    /* NAVBAR */
    .navbar { position:fixed; top:0; left:0; right:0; z-index:100; height:68px; background:rgba(6,13,31,.85); backdrop-filter:blur(20px); border-bottom:1px solid rgba(79,195,247,.1); }
    .navbar .container { height:100%; display:flex; align-items:center; gap:32px; }
    .nav-brand { display:flex; align-items:center; gap:10px; font-size:1.25rem; font-weight:800; flex-shrink:0; }
    .brand-icon { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#00e676,#4fc3f7); display:flex; align-items:center; justify-content:center; font-size:1rem; }
    .bhl { color:#00e676; }
    .nav-links { display:flex; align-items:center; gap:26px; }
    .nav-links a { font-size:.88rem; font-weight:500; color:#6b88aa; transition:color .2s; }
    .nav-links a:hover { color:#e2ecff; }
    .nav-actions { margin-left:auto; display:flex; align-items:center; gap:10px; }

    /* AUTH PAGE CONTENT */
    .auth-section { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 100px 0 60px; overflow: hidden; }
    .hero-mesh { position:absolute; inset:0; background:radial-gradient(ellipse 70% 55% at 50% 30%,rgba(0,230,118,.09) 0%,transparent 65%),radial-gradient(ellipse 55% 70% at 85% 75%,rgba(79,195,247,.08) 0%,transparent 65%); pointer-events:none; }
    .hero-gridbg { position:absolute; inset:0; background-image:linear-gradient(rgba(79,195,247,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(79,195,247,.04) 1px,transparent 1px); background-size:52px 52px; pointer-events:none; }

    .auth-card { width: 100%; max-width: 440px; border-radius: 24px; padding: 44px 36px; background: rgba(12, 24, 53, 0.85); backdrop-filter: blur(24px); border: 1px solid rgba(79, 195, 247, 0.18); box-shadow: 0 32px 80px rgba(0,0,0,0.6); position: relative; z-index: 10; animation: float 6s ease-in-out infinite; }
    .auth-hdr { text-align: center; margin-bottom: 28px; }
    .auth-icon { width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, rgba(0,230,118,0.2), rgba(79,195,247,0.2)); border: 1px solid rgba(0,230,118,0.3); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 16px; }
    .auth-title { font-family: 'DM Serif Display', serif; font-size: 2rem; margin-bottom: 8px; }
    .auth-sub { font-size: 0.9rem; color: #a8c0dc; }

    .auth-tabs { display: flex; margin-bottom: 28px; border-radius: 12px; background: rgba(255,255,255,0.04); padding: 4px; border: 1px solid rgba(79,195,247,0.1); }
    .auth-tab { flex: 1; padding: 12px; border-radius: 9px; border: none; background: transparent; color: #6b88aa; font-family: 'Outfit', sans-serif; font-size: 0.92rem; font-weight: 700; cursor: pointer; transition: all 0.22s; text-align: center; }
    .auth-tab.active { background: linear-gradient(135deg, #00e676, #00c853); color: #060d1f; box-shadow: 0 4px 16px rgba(0,230,118,0.3); }

    .fgroup { margin-bottom: 20px; }
    .flabel { display: block; font-size: 0.83rem; font-weight: 600; color: #a8c0dc; margin-bottom: 8px; }
    .finput { width: 100%; padding: 14px 18px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(79,195,247,0.18); color: #e2ecff; font-family: 'Outfit', sans-serif; font-size: 0.95rem; transition: all 0.2s; outline: none; }
    .finput:focus { border-color: rgba(0,230,118,0.5); background: rgba(255,255,255,0.08); box-shadow: 0 0 0 4px rgba(0,230,118,0.12); }
    .finput::placeholder { color: #5a789a; }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 28px; height:50px; border-radius:12px; font-family:'Outfit',sans-serif; font-size:1rem; font-weight:700; border:none; cursor:pointer; white-space:nowrap; transition:all .22s; width:100%; text-decoration:none; }
    .btn-primary { background:linear-gradient(135deg,#00e676,#00c853); color:#060d1f; }
    .btn-primary:hover { opacity:.9; transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,230,118,.38); }
    .btn-ghost { background:transparent; color:#e2ecff; border:1.5px solid rgba(79,195,247,.25); }

    .auth-footer-text { text-align: center; margin-top: 24px; font-size: 0.88rem; color: #6b88aa; }
    .auth-footer-text a { color: #00e676; font-weight: 600; text-decoration: underline; }

    .footer { background:rgba(9,16,34,.95); border-top:1px solid rgba(79,195,247,.1); padding:24px 0; text-align:center; font-size:.82rem; color:#6b88aa; margin-top:auto; }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="container">
    <a href="index.html" class="nav-brand">
      <div class="brand-icon">💰</div>
      Save<span class="bhl">Hatke</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="marketplace.html">Coupons</a>
      <a href="sell.html">Sell Coupons</a>
      <a href="support.html">Support</a>
    </div>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-ghost" style="height:36px;padding:0 16px;font-size:.85rem;border-radius:8px">← Back to Home</a>
    </div>
  </div>
</nav>

<!-- AUTH CONTENT -->
<main class="auth-section">
  <div class="hero-mesh"></div>
  <div class="hero-gridbg"></div>

  <div class="auth-card">
    <div class="auth-hdr">
      <div class="auth-icon">🔐</div>
      <h1 class="auth-title" id="pageTitle">Welcome Back</h1>
      <p class="auth-sub" id="pageSub">Log in to manage your coupons and price drop alerts.</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabBtnLogin" onclick="setMode('login')">Log In</button>
      <button class="auth-tab" id="tabBtnRegister" onclick="setMode('register')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="loginPageForm" onsubmit="handleAuthSubmit(event)">
      <div class="fgroup" id="nameGroup" style="display:none">
        <label class="flabel" for="inputName">Full Name</label>
        <input type="text" class="finput" id="inputName" placeholder="Rahul Kumar">
      </div>

      <div class="fgroup">
        <label class="flabel" for="inputEmail">Email Address</label>
        <input type="email" class="finput" id="inputEmail" placeholder="you@example.com" required>
      </div>

      <div class="fgroup">
        <label class="flabel" for="inputPassword">Password</label>
        <input type="password" class="finput" id="inputPassword" placeholder="Enter your password" required minlength="6">
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">
        Log In to SaveHatke →
      </button>
    </form>

    <div class="auth-footer-text" id="toggleFooterText">
      Don't have an account? <a href="javascript:void(0)" onclick="setMode('register')">Sign up free</a>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <span>© 2026 SaveHatke. All rights reserved. Made with ❤️ in India</span>
  </div>
</footer>

<script src="js/app.js"></script>
<script>
  let currentMode = 'login';

  // Check URL params for ?tab=register
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('tab') === 'register') {
    setMode('register');
  }

  function setMode(mode) {
    currentMode = mode;
    const isLogin = mode === 'login';

    document.getElementById('tabBtnLogin').classList.toggle('active', isLogin);
    document.getElementById('tabBtnRegister').classList.toggle('active', !isLogin);

    document.getElementById('pageTitle').textContent = isLogin ? 'Welcome Back' : 'Create Free Account';
    document.getElementById('pageSub').textContent = isLogin 
      ? 'Log in to manage your coupons and price drop alerts.' 
      : 'Start tracking prices and trading coupons in seconds.';

    document.getElementById('nameGroup').style.display = isLogin ? 'none' : 'block';
    if (!isLogin) {
      document.getElementById('inputName').setAttribute('required', 'required');
    } else {
      document.getElementById('inputName').removeAttribute('required');
    }

    document.getElementById('submitBtn').textContent = isLogin ? 'Log In to SaveHatke →' : 'Create Free Account →';

    document.getElementById('toggleFooterText').innerHTML = isLogin
      ? `Don't have an account? <a href="javascript:void(0)" onclick="setMode('register')">Sign up free</a>`
      : `Already have an account? <a href="javascript:void(0)" onclick="setMode('login')">Log in</a>`;
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Please wait...';

    const email = document.getElementById('inputEmail').value.trim();
    const password = document.getElementById('inputPassword').value.trim();

    try {
      if (currentMode === 'login') {
        const data = await api('/auth/login', {
          method: 'POST',
          body: { email, password },
        });
        Auth.setAuth(data.token, data.user);
        showToast('Welcome back! 👋', 'success');
      } else {
        const name = document.getElementById('inputName').value.trim();
        const data = await api('/auth/register', {
          method: 'POST',
          body: { name, email, password },
        });
        Auth.setAuth(data.token, data.user);
        showToast('Account created successfully! 🎉', 'success');
      }

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    } catch (err) {
      showToast(err.message || 'Authentication failed. Please check details.', 'error');
      btn.disabled = false;
      btn.textContent = currentMode === 'login' ? 'Log In to SaveHatke →' : 'Create Free Account →';
    }
  }
</script>
</body>
</html>
