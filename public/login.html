<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in or create an account on SaveHatke — India's smartest price tracker & coupon marketplace.">
  <title>Log In / Sign Up — SaveHatke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; height: 100%; }
    body { font-family: 'Outfit', sans-serif; background: #060d1f; color: #e2ecff; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #060d1f; }
    ::-webkit-scrollbar-thumb { background: #1a3055; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #00e676; }
    a { text-decoration: none; color: inherit; }

    @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes float-particle {
      0% { transform:translateY(100vh) scale(0); opacity:0; }
      20% { opacity:0.6; }
      80% { opacity:0.3; }
      100% { transform:translateY(-100px) scale(1.2); opacity:0; }
    }

    .particles { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
    .particle { position:absolute; width:3px; height:3px; background:#00e676; border-radius:50%; opacity:0; animation:float-particle linear infinite; box-shadow:0 0 8px #00e676; }

    .gtext { background: linear-gradient(135deg,#00e676,#4fc3f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .shimmer { background: linear-gradient(90deg,#00e676 0%,#4fc3f7 35%,#00e676 70%,#4fc3f7 100%); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:shimmer 3.5s linear infinite; }

    .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; width: 100%; }

    /* NAVBAR */
    .navbar { position:fixed; top:0; left:0; right:0; z-index:100; height:64px; background:rgba(6,13,31,.85); backdrop-filter:blur(20px); border-bottom:1px solid rgba(79,195,247,.1); }
    .navbar .container { height:100%; display:flex; align-items:center; gap:32px; }
    .nav-brand { display:flex; align-items:center; gap:10px; font-size:1.2rem; font-weight:800; flex-shrink:0; }
    .brand-icon { width:32px; height:32px; border-radius:8px; background:linear-gradient(135deg,#00e676,#4fc3f7); display:flex; align-items:center; justify-content:center; font-size:0.95rem; }
    .bhl { color:#00e676; }
    .nav-links { display:flex; align-items:center; gap:24px; }
    .nav-links a { font-size:.85rem; font-weight:500; color:#6b88aa; transition:color .2s; }
    .nav-links a:hover { color:#e2ecff; }
    .nav-actions { margin-left:auto; display:flex; align-items:center; gap:10px; }

    /* WIDE & LOW HEIGHT AUTH CARD */
    .auth-section { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 84px 0 40px; overflow: hidden; }
    .hero-mesh { position:absolute; inset:0; background:radial-gradient(ellipse 70% 55% at 50% 30%,rgba(0,230,118,.09) 0%,transparent 65%),radial-gradient(ellipse 55% 70% at 85% 75%,rgba(79,195,247,.08) 0%,transparent 65%); pointer-events:none; }
    .hero-gridbg { position:absolute; inset:0; background-image:linear-gradient(rgba(79,195,247,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(79,195,247,.04) 1px,transparent 1px); background-size:52px 52px; pointer-events:none; }

    .auth-card { width: 100%; max-width: 520px; border-radius: 20px; padding: 24px 32px; background: rgba(12, 24, 53, 0.88); backdrop-filter: blur(24px); border: 1px solid rgba(79, 195, 247, 0.18); box-shadow: 0 24px 60px rgba(0,0,0,0.55); position: relative; z-index: 10; animation: float 6s ease-in-out infinite; }
    .auth-hdr { text-align: center; margin-bottom: 16px; }
    .auth-icon { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, rgba(0,230,118,0.2), rgba(79,195,247,0.2)); border: 1px solid rgba(0,230,118,0.3); display: flex; align-items: center; justify-content: center; font-size: 1.15rem; margin: 0 auto 8px; }
    .auth-title { font-family: 'DM Serif Display', serif; font-size: 1.55rem; margin-bottom: 4px; }
    .auth-sub { font-size: 0.82rem; color: #a8c0dc; }

    .auth-tabs { display: flex; margin-bottom: 16px; border-radius: 10px; background: rgba(255,255,255,0.04); padding: 3px; border: 1px solid rgba(79,195,247,0.1); }
    .auth-tab { flex: 1; padding: 8px; border-radius: 7px; border: none; background: transparent; color: #6b88aa; font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 700; cursor: pointer; transition: all 0.2s; text-align: center; }
    .auth-tab.active { background: linear-gradient(135deg, #00e676, #00c853); color: #060d1f; box-shadow: 0 4px 14px rgba(0,230,118,0.3); }

    /* HORIZONTAL TWO-COLUMN FORM LAYOUT */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .full-width { grid-column: 1 / -1; }

    .fgroup { margin-bottom: 0; }
    .flabel { display: block; font-size: 0.78rem; font-weight: 600; color: #a8c0dc; margin-bottom: 5px; }
    .finput { width: 100%; padding: 10px 13px; border-radius: 9px; background: rgba(255,255,255,0.05); border: 1.5px solid rgba(79,195,247,0.18); color: #e2ecff; font-family: 'Outfit', sans-serif; font-size: 0.88rem; transition: all 0.2s; outline: none; }
    .finput:focus { border-color: rgba(0,230,118,0.5); background: rgba(255,255,255,0.08); box-shadow: 0 0 0 3px rgba(0,230,118,0.12); }
    .finput::placeholder { color: #5a789a; }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 20px; height:42px; border-radius:9px; font-family:'Outfit',sans-serif; font-size:0.9rem; font-weight:700; border:none; cursor:pointer; white-space:nowrap; transition:all .2s; width:100%; text-decoration:none; }
    .btn-primary { background:linear-gradient(135deg,#00e676,#00c853); color:#060d1f; }
    .btn-primary:hover { opacity:.9; transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,230,118,.35); }
    .btn-ghost { background:transparent; color:#e2ecff; border:1.5px solid rgba(79,195,247,.25); }

    /* GOOGLE PROVIDER AT BOTTOM */
    .auth-divider { display: flex; align-items: center; text-align: center; margin: 12px 0; color: #6b88aa; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; }
    .auth-divider::before, .auth-divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(79,195,247,0.12); }
    .auth-divider span { padding: 0 10px; }

    .social-providers { margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .social-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 9px; background: rgba(255,255,255,0.06); border: 1.5px solid rgba(79,195,247,0.2); color: #e2ecff; font-family: 'Outfit', sans-serif; font-size: 0.86rem; font-weight: 600; cursor: pointer; transition: all 0.2s; width: 100%; }
    .social-btn:hover { background: rgba(255,255,255,0.12); border-color: rgba(0,230,118,0.4); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.3); }

    .auth-footer-text { text-align: center; margin-top: 12px; font-size: 0.8rem; color: #6b88aa; }
    .auth-footer-text a { color: #00e676; font-weight: 600; text-decoration: underline; }

    .footer { background:rgba(9,16,34,.95); border-top:1px solid rgba(79,195,247,.1); padding:18px 0; text-align:center; font-size:.78rem; color:#6b88aa; margin-top:auto; }

    @media (max-width: 540px) {
      .auth-card { max-width: 100%; padding: 20px 16px; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <div class="container">
    <a href="index.html" class="nav-brand">
      <div class="brand-icon">💰</div>
      Save<span class="bhl">Hatke</span>
    </a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="marketplace.html">Coupons</a>
      <a href="sell.html">Sell Coupons</a>
      <a href="support.html">Support</a>
    </div>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-ghost" style="height:32px;padding:0 12px;font-size:.8rem;border-radius:6px">← Home</a>
    </div>
  </div>
</nav>

<!-- AUTH CONTENT -->
<main class="auth-section">
  <div class="hero-mesh"></div>
  <div class="hero-gridbg"></div>
  <div class="particles" id="loginParticles"></div>

  <div class="auth-card">
    <div class="auth-hdr">
      <div class="auth-icon">🔐</div>
      <h1 class="auth-title" id="pageTitle">Welcome Back</h1>
      <p class="auth-sub" id="pageSub">Log in to manage your coupons and price alerts.</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tabBtnLogin" onclick="setMode('login')">Log In</button>
      <button class="auth-tab" id="tabBtnRegister" onclick="setMode('register')">Sign Up</button>
    </div>

    <!-- Wide Two-Column Form -->
    <form id="loginPageForm" onsubmit="handleAuthSubmit(event)">
      <div class="form-grid">
        <div class="fgroup full-width" id="nameGroup" style="display:none">
          <label class="flabel" for="inputName">Full Name</label>
          <input type="text" class="finput" id="inputName" placeholder="Rahul Kumar">
        </div>

        <div class="fgroup" id="emailGroup">
          <label class="flabel" for="inputEmail">Email Address</label>
          <input type="email" class="finput" id="inputEmail" placeholder="you@example.com" required>
        </div>

        <div class="fgroup" id="passGroup">
          <label class="flabel" for="inputPassword">Password</label>
          <input type="password" class="finput" id="inputPassword" placeholder="Enter password" required minlength="6">
        </div>

        <div class="fgroup full-width">
          <button type="submit" class="btn btn-primary" id="submitBtn">
            Log In to SaveHatke →
          </button>
        </div>
      </div>
    </form>

    <div class="auth-divider">
      <span>OR</span>
    </div>

    <!-- Real Google Login Button -->
    <div class="social-providers">
      <button class="social-btn" id="googleBtn" onclick="handleRealGoogleAuth()">
        <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.24 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.24 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        <span>Continue with Google</span>
      </button>

      <!-- Google GSI Hidden Render Target -->
      <div id="g_id_onload"
           data-client_id="928374829104-savehatke2026.apps.googleusercontent.com"
           data-callback="handleGoogleCredentialResponse"
           data-auto_prompt="false"
           style="display:none;">
      </div>
    </div>

    <div class="auth-footer-text" id="toggleFooterText">
      Don't have an account? <a href="javascript:void(0)" onclick="setMode('register')">Sign up free</a>
    </div>
  </div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <span>© 2026 SaveHatke. All rights reserved. Made with ❤️ in India</span>
  </div>
</footer>

<script src="js/app.js"></script>
<script>
  let currentMode = 'login';

  // Check URL params for ?tab=register
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('tab') === 'register') {
    setMode('register');
  }

  function setMode(mode) {
    currentMode = mode;
    const isLogin = mode === 'login';

    document.getElementById('tabBtnLogin').classList.toggle('active', isLogin);
    document.getElementById('tabBtnRegister').classList.toggle('active', !isLogin);

    document.getElementById('pageTitle').textContent = isLogin ? 'Welcome Back' : 'Create Free Account';
    document.getElementById('pageSub').textContent = isLogin 
      ? 'Log in to manage your coupons and price alerts.' 
      : 'Start tracking prices and trading coupons in seconds.';

    document.getElementById('nameGroup').style.display = isLogin ? 'none' : 'block';
    if (!isLogin) {
      document.getElementById('inputName').setAttribute('required', 'required');
    } else {
      document.getElementById('inputName').removeAttribute('required');
    }

    document.getElementById('submitBtn').textContent = isLogin ? 'Log In to SaveHatke →' : 'Create Free Account →';

    document.getElementById('toggleFooterText').innerHTML = isLogin
      ? `Don't have an account? <a href="javascript:void(0)" onclick="setMode('register')">Sign up free</a>`
      : `Already have an account? <a href="javascript:void(0)" onclick="setMode('login')">Log in</a>`;
  }

  // Initialize Google Identity Services
  let activeGoogleClientId = "930893529973-2j5h36csl909m139urdq552n63h1hl1q.apps.googleusercontent.com";

  window.onload = async function () {
    // Check if returning from Google OAuth redirect
    checkGoogleRedirect();

    try {
      const cfg = await api('/auth/google-config');
      if (cfg && cfg.clientId) activeGoogleClientId = cfg.clientId;
    } catch (e) {
      console.warn('Could not fetch server google-config:', e.message);
    }

    if (window.google && window.google.accounts) {
      google.accounts.id.initialize({
        client_id: activeGoogleClientId,
        callback: handleGoogleCredentialResponse,
        cancel_on_tap_outside: true
      });
    }
  };

  // Redirect directly to official Google OAuth Account Chooser screen (Image 2)
  function handleRealGoogleAuth() {
    const googleBtn = document.getElementById('googleBtn');
    if (googleBtn) {
      googleBtn.disabled = true;
      googleBtn.innerHTML = `
        <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.24 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.24 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        <span>Redirecting to Google...</span>
      `;
    }

    const redirectUri = window.location.origin + window.location.pathname;
    const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(activeGoogleClientId)}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=id_token%20token&scope=openid%20email%20profile&nonce=${Date.now()}&prompt=select_account`;
    
    // Redirect browser to official Google accounts chooser page
    window.location.href = googleAuthUrl;
  }

  // Handle return redirect from Google OAuth
  async function checkGoogleRedirect() {
    const hash = window.location.hash;
    if (hash && (hash.includes('id_token=') || hash.includes('access_token='))) {
      const params = new URLSearchParams(hash.substring(1));
      const idToken = params.get('id_token');
      const accessToken = params.get('access_token');

      // Clear the hash from URL cleanly
      window.history.replaceState(null, null, window.location.pathname);

      if (idToken) {
        handleGoogleCredentialResponse({ credential: idToken });
      } else if (accessToken) {
        try {
          showToast('Verifying Google account...', 'info');
          const res = await fetch(`https://www.googleapis.com/oauth2/v3/userinfo?access_token=${accessToken}`);
          const profile = await res.json();
          if (profile.email) {
            const data = await api('/auth/google', {
              method: 'POST',
              body: { email: profile.email, name: profile.name, picture: profile.picture }
            });
            Auth.setAuth(data.token, data.user);
            showToast(`Welcome ${data.user.name}! Signed in with Google 🎉`, 'success');
            setTimeout(() => window.location.href = 'dashboard.html', 500);
          }
        } catch (e) {
          showToast('Google authentication failed.', 'error');
        }
      }
    }
  }

  // Callback after real Google OAuth login completes
  async function handleGoogleCredentialResponse(response) {
    try {
      showToast('Authenticating with Google...', 'info');
      const data = await api('/auth/google', {
        method: 'POST',
        body: { credential: response.credential }
      });
      Auth.setAuth(data.token, data.user);
      showToast(`Welcome ${data.user.name}! Google Login Successful 🎉`, 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    } catch (err) {
      showToast(err.message || 'Google authentication failed.', 'error');
    }
  }
      googleBtn.innerHTML = `
        <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.24 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.24 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        <span>Continue with Google</span>
      `;
    }
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Please wait...';

    const email = document.getElementById('inputEmail').value.trim();
    const password = document.getElementById('inputPassword').value.trim();

    try {
      if (currentMode === 'login') {
        const data = await api('/auth/login', {
          method: 'POST',
          body: { email, password },
        });
        Auth.setAuth(data.token, data.user);
        showToast('Welcome back! 👋', 'success');
      } else {
        const name = document.getElementById('inputName').value.trim();
        const data = await api('/auth/register', {
          method: 'POST',
          body: { name, email, password },
        });
        Auth.setAuth(data.token, data.user);
        showToast('Account created successfully! 🎉', 'success');
      }

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    } catch (err) {
      showToast(err.message || 'Authentication failed. Please check details.', 'error');
      btn.disabled = false;
      btn.textContent = currentMode === 'login' ? 'Log In to SaveHatke →' : 'Create Free Account →';
    }
  }
</script>
</body>
</html>
