<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in or create an account on SaveHatke — India's smartest price tracker & coupon marketplace.">
  <title>Login — SaveHatke</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; height: 100%; }
    body { font-family: 'Outfit', sans-serif; background: #060d1f; color: #e2ecff; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #060d1f; }
    ::-webkit-scrollbar-thumb { background: #1a3055; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #00e676; }
    a { text-decoration: none; color: inherit; }

    @keyframes shimmer { 0%{background-position:-200% center} 100%{background-position:200% center} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes float-particle {
      0% { transform:translateY(100vh) scale(0); opacity:0; }
      20% { opacity:0.6; }
      80% { opacity:0.3; }
      100% { transform:translateY(-100px) scale(1.2); opacity:0; }
    }

    .particles { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1; }
    .particle { position:absolute; width:3px; height:3px; background:#00e676; border-radius:50%; opacity:0; animation:float-particle linear infinite; box-shadow:0 0 8px #00e676; }

    .gtext { background: linear-gradient(135deg,#00e676,#4fc3f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
    .shimmer { background: linear-gradient(90deg,#00e676 0%,#4fc3f7 35%,#00e676 70%,#4fc3f7 100%); background-size:200% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; animation:shimmer 3.5s linear infinite; }

    .container { max-width: 1160px; margin: 0 auto; padding: 0 24px; width: 100%; }

    /* NAVBAR */
    .navbar { position:fixed; top:0; left:0; right:0; z-index:100; height:68px; background:rgba(6,13,31,.85); backdrop-filter:blur(20px); border-bottom:1px solid rgba(79,195,247,.1); transition:background .3s; }
    .navbar .container { height:100%; display:flex; align-items:center; gap:32px; }
    .nav-brand { display:flex; align-items:center; gap:10px; font-size:1.25rem; font-weight:800; flex-shrink:0; }
    .brand-icon { width:34px; height:34px; border-radius:9px; background:linear-gradient(135deg,#00e676,#4fc3f7); display:flex; align-items:center; justify-content:center; font-size:1rem; }
    .bhl { color:#00e676; }
    .nav-links { display:flex; align-items:center; gap:26px; }
    .nav-links a { font-size:.88rem; font-weight:500; color:#6b88aa; transition:color .2s; }
    .nav-links a:hover { color:#e2ecff; }
    .nav-actions { margin-left:auto; display:flex; align-items:center; gap:10px; }
    .nav-toggle { display:none; flex-direction:column; gap:5px; background:none; border:none; cursor:pointer; padding:4px; margin-left:auto; }
    .nav-toggle span { display:block; width:22px; height:2px; background:#e2ecff; border-radius:2px; transition:all .3s; }
    @media(max-width:768px){
      .nav-links,.nav-actions{display:none}
      .nav-toggle{display:flex}
      .nav-links.open{display:flex;flex-direction:column;position:absolute;top:68px;left:0;right:0;background:#0c1835;padding:20px 24px;border-bottom:1px solid rgba(79,195,247,.1);gap:18px;z-index:99}
    }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 28px; height:48px; border-radius:10px; font-family:'Outfit',sans-serif; font-size:.95rem; font-weight:700; border:none; cursor:pointer; white-space:nowrap; transition:all .22s; width:100%; text-decoration:none; }
    .btn-primary { background:linear-gradient(135deg,#00e676,#00c853); color:#060d1f; }
    .btn-primary:hover { opacity:.88; transform:translateY(-2px); box-shadow:0 10px 28px rgba(0,230,118,.38); }
    .btn-ghost { background:transparent; color:#e2ecff; border:1.5px solid rgba(79,195,247,.25); width:auto; }
    .btn-ghost:hover { border-color:rgba(79,195,247,.5); background:rgba(79,195,247,.07); }
    .btn-sm { height:38px; padding:0 18px; font-size:.85rem; border-radius:8px; }

    /* AUTH SECTION */
    .auth-section { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; padding: 88px 0 40px; overflow: hidden; }
    .hero-mesh { position:absolute; inset:0; background:radial-gradient(ellipse 70% 55% at 50% 30%,rgba(0,230,118,.09) 0%,transparent 65%),radial-gradient(ellipse 55% 70% at 85% 75%,rgba(79,195,247,.08) 0%,transparent 65%); pointer-events:none; }
    .hero-gridbg { position:absolute; inset:0; background-image:linear-gradient(rgba(79,195,247,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(79,195,247,.04) 1px,transparent 1px); background-size:52px 52px; pointer-events:none; }

    .auth-card { width:100%; max-width:440px; border-radius:22px; padding:36px 36px 32px; background:rgba(12,24,53,.92); backdrop-filter:blur(24px); border:1px solid rgba(79,195,247,.18); box-shadow:0 32px 80px rgba(0,0,0,.55); position:relative; z-index:10; animation:float 6s ease-in-out infinite; }

    .auth-hdr { text-align:center; margin-bottom:28px; }
    .auth-icon { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,rgba(0,230,118,.2),rgba(79,195,247,.2)); border:1px solid rgba(0,230,118,.3); display:flex; align-items:center; justify-content:center; font-size:1.25rem; margin:0 auto 12px; }
    .auth-title { font-family:'DM Serif Display',serif; font-size:1.65rem; margin-bottom:6px; }
    .auth-sub { font-size:.84rem; color:#a8c0dc; line-height:1.5; }

    .fgroup { margin-bottom:16px; }
    .flabel { display:block; font-size:.8rem; font-weight:600; color:#a8c0dc; margin-bottom:7px; }
    .finput { width:100%; padding:12px 15px; border-radius:10px; background:rgba(255,255,255,.05); border:1.5px solid rgba(79,195,247,.18); color:#e2ecff; font-family:'Outfit',sans-serif; font-size:.92rem; transition:all .2s; outline:none; }
    .finput:focus { border-color:rgba(0,230,118,.5); background:rgba(255,255,255,.08); box-shadow:0 0 0 3px rgba(0,230,118,.12); }
    .finput::placeholder { color:#5a789a; }

    .auth-divider { display:flex; align-items:center; text-align:center; margin:16px 0; color:#6b88aa; font-size:.7rem; font-weight:700; letter-spacing:.1em; }
    .auth-divider::before, .auth-divider::after { content:''; flex:1; border-bottom:1px solid rgba(79,195,247,.12); }
    .auth-divider span { padding:0 12px; }

    .social-btn { display:flex; align-items:center; justify-content:center; gap:9px; padding:12px 16px; border-radius:10px; background:rgba(255,255,255,.05); border:1.5px solid rgba(79,195,247,.2); color:#e2ecff; font-family:'Outfit',sans-serif; font-size:.9rem; font-weight:600; cursor:pointer; transition:all .2s; width:100%; }
    .social-btn:hover { background:rgba(255,255,255,.1); border-color:rgba(0,230,118,.4); transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.3); }

    .auth-footer-text { text-align:center; margin-top:16px; font-size:.82rem; color:#6b88aa; }
    .auth-footer-text a { color:#00e676; font-weight:600; text-decoration:none; border-bottom:1px solid rgba(0,230,118,.3); transition:border-color .2s; }
    .auth-footer-text a:hover { border-color:#00e676; }

    /* TOAST */
    .toast-container { position:fixed; bottom:28px; right:28px; z-index:999; display:flex; flex-direction:column; gap:10px; }
    .toast { padding:14px 20px; border-radius:12px; font-size:.88rem; font-weight:600; box-shadow:0 12px 40px rgba(0,0,0,.5); display:flex; align-items:center; gap:10px; max-width:320px; animation:fadeUp .3s ease; }
    .toast-success { background:rgba(0,200,83,.15); border:1px solid rgba(0,200,83,.3); color:#00e676; }
    .toast-error { background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.25); color:#f87171; }
    .toast-warning { background:rgba(251,191,36,.1); border:1px solid rgba(251,191,36,.2); color:#fbbf24; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(26px)} to{opacity:1;transform:translateY(0)} }

    /* FOOTER */
    .footer { background:rgba(9,16,34,.95); border-top:1px solid rgba(79,195,247,.1); padding:20px 0; text-align:center; font-size:.8rem; color:#6b88aa; margin-top:auto; }

    @media(max-width:500px) {
      .auth-card { max-width:100%; padding:28px 20px; }
    }
  </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar" id="nav">
  <div class="container">
    <a href="index.html" class="nav-brand">
      <div class="brand-icon">💰</div>
      Save<span class="bhl">Hatke</span>
    </a>
    <div class="nav-links" id="navLinks">
      <a href="index.html">Home</a>
      <a href="marketplace.html">Coupons</a>
      <a href="sell.html">Sell Coupons</a>
      <a href="support.html">Support</a>
    </div>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-ghost btn-sm">← Home</a>
    </div>
    <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<!-- AUTH CONTENT -->
<main class="auth-section">
  <div class="hero-mesh"></div>
  <div class="hero-gridbg"></div>
  <div class="particles" id="loginParticles"></div>

  <div class="auth-card">
    <div class="auth-hdr">
      <div class="auth-icon">🔐</div>
      <h1 class="auth-title">Welcome to <span class="gtext">SaveHatke</span></h1>
      <p class="auth-sub">Enter your email to continue to your account.</p>
    </div>

    <form id="loginPageForm" onsubmit="handleAuthSubmit(event)">
      <div class="fgroup">
        <label class="flabel" for="inputEmail">Email Address</label>
        <input type="email" class="finput" id="inputEmail" placeholder="you@example.com" required autocomplete="email">
      </div>
      <button type="submit" class="btn btn-primary" id="submitBtn">
        Continue →
      </button>
    </form>

    <div class="auth-divider"><span>OR</span></div>

    <!-- Google Login -->
    <button class="social-btn" id="googleBtn" onclick="handleRealGoogleAuth()">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.24 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.24 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div id="g_id_onload"
         data-client_id=""
         data-callback="handleGoogleCredentialResponse"
         data-auto_prompt="false"
         style="display:none;">
    </div>


  </div>
</main>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <span>© 2026 SaveHatke. All rights reserved. Made with ❤️ in India</span>
  </div>
</footer>

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/app.js"></script>
<script>
  // Sticky nav
  window.addEventListener('scroll', () => {
    const nav = document.getElementById('nav');
    if (nav) nav.style.background = window.scrollY > 40 ? 'rgba(6,13,31,0.97)' : 'rgba(6,13,31,0.85)';
  });

  // Mobile nav toggle
  const navToggle = document.getElementById('navToggle');
  if (navToggle) {
    navToggle.addEventListener('click', () => {
      document.getElementById('navLinks')?.classList.toggle('open');
    });
  }

  // Spawn particles
  (function spawnParticles() {
    const container = document.getElementById('loginParticles');
    if (!container) return;
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (6 + Math.random() * 10) + 's';
      p.style.animationDelay = (Math.random() * 8) + 's';
      p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
      container.appendChild(p);
    }
  })();

  // ── Google Auth ────────────────────────────────────────────────────────────
  const DEFAULT_GOOGLE_CLIENT_ID = "930893529973-2j5h36csl909m139urdq552n63h1hl1q.apps.googleusercontent.com";
  let activeGoogleClientId = DEFAULT_GOOGLE_CLIENT_ID;

  async function fetchGoogleClientId() {
    try {
      const cfg = await api('/auth/google-config');
      if (cfg && cfg.clientId && cfg.clientId.trim() !== '') {
        activeGoogleClientId = cfg.clientId;
      }
    } catch (e) {
      console.warn('Could not fetch server google-config, using fallback client ID:', e.message);
    }
    return activeGoogleClientId;
  }

  async function initGoogleAuth() {
    checkGoogleRedirect();
    const clientId = await fetchGoogleClientId();
    if (window.google && window.google.accounts && clientId) {
      try {
        google.accounts.id.initialize({
          client_id: clientId,
          callback: handleGoogleCredentialResponse,
          cancel_on_tap_outside: true
        });
      } catch (err) {
        console.warn('GSI init error:', err);
      }
    }
  }

  document.addEventListener('DOMContentLoaded', initGoogleAuth);

  // Redirect directly to official Google OAuth Account Chooser screen
  async function handleRealGoogleAuth() {
    const googleBtn = document.getElementById('googleBtn');
    const originalBtnHtml = googleBtn ? googleBtn.innerHTML : '';

    if (googleBtn) {
      googleBtn.disabled = true;
      googleBtn.innerHTML = `
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.26v3.15C3.24 21.3 7.31 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.26C.46 8.17 0 9.99 0 12s.46 3.83 1.26 5.42l4.02-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.24 2.7 1.26 6.58l4.02 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
        <span>Redirecting to Google...</span>
      `;
    }

    let clientId = activeGoogleClientId;
    if (!clientId) clientId = await fetchGoogleClientId();

    if (!clientId) {
      if (googleBtn) { googleBtn.disabled = false; googleBtn.innerHTML = originalBtnHtml; }
      showToast('Google login is not configured. Missing Client ID.', 'error');
      return;
    }

    const redirectUri = window.location.origin + window.location.pathname;
    const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${encodeURIComponent(clientId)}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token%20id_token&scope=openid%20email%20profile&nonce=${Date.now()}&prompt=select_account`;
    window.location.href = googleAuthUrl;
  }

  // Handle return redirect from Google OAuth
  async function checkGoogleRedirect() {
    const hash = window.location.hash;
    if (hash && (hash.includes('id_token=') || hash.includes('access_token='))) {
      const params = new URLSearchParams(hash.substring(1));
      const idToken = params.get('id_token');
      const accessToken = params.get('access_token');

      window.history.replaceState(null, null, window.location.pathname);

      if (idToken) {
        handleGoogleCredentialResponse({ credential: idToken });
      } else if (accessToken) {
        try {
          const res = await fetch(`https://www.googleapis.com/oauth2/v3/userinfo?access_token=${accessToken}`);
          const profile = await res.json();
          if (profile.email) {
            const data = await api('/auth/google', {
              method: 'POST',
              body: { email: profile.email, name: profile.name, picture: profile.picture }
            });
            Auth.setAuth(data.token, data.user);
            if (data.user.role === 'admin') {
              Auth.setAdminAuth(data.token, data.user);
              window.location.replace('admin.html');
            } else {
              window.location.replace('index.html');
            }
          }
        } catch (e) {
          showToast('Google authentication failed.', 'error');
        }
      }
    }
  }

  // Callback after real Google OAuth login completes
  async function handleGoogleCredentialResponse(response) {
    try {
      const data = await api('/auth/google', {
        method: 'POST',
        body: { credential: response.credential }
      });
      Auth.setAuth(data.token, data.user);
      if (data.user.role === 'admin') {
        Auth.setAdminAuth(data.token, data.user);
        window.location.replace('admin.html');
      } else {
        window.location.replace('index.html');
      }
    } catch (err) {
      showToast(err.message || 'Google authentication failed.', 'error');
    }
  }

  // ── Email Continue Submit ──────────────────────────────────────────────────
  async function handleAuthSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Please wait...';

    const email = document.getElementById('inputEmail').value.trim();

    try {
      const data = await api('/auth/login', {
        method: 'POST',
        body: { email },
      });
      Auth.setAuth(data.token, data.user);

      if (data.user.role === 'admin' || data.user.role === 'Super Admin' || data.user.role === 'Admin') {
        Auth.setAdminAuth(data.token, data.user);
        window.location.replace('admin.html');
      } else {
        window.location.replace('index.html');
      }
    } catch (err) {
      showToast(err.message || 'Authentication failed. Please check your email.', 'error');
      btn.disabled = false;
      btn.textContent = 'Continue →';
    }
  }
</script>
</body>
</html>
